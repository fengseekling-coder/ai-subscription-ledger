name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run core tests
        run: npm run test:core

      - name: Build core package
        run: npm run build -w @ai-sub/core

      # desktop 的组件测试会 import "@ai-sub/core"，该包的 package.json 指向
      # ./dist/index.js —— 必须放在上面的 build 之后，否则在没有本地残留 dist/
      # 的干净 checkout 里（例如 CI）会直接报 "Failed to resolve entry"。
      - name: Run desktop tests
        run: npm run test:desktop

      # 统计口径守卫：与 scripts/parity-baseline.json 比对，漂移即失败。
      # 改动 stats/rules/dates 后如属预期，跑 `npm run parity -- --update` 重写基准。
      - name: Check stats parity against baseline
        run: npm run parity

      - name: Type check desktop
        run: cd apps/desktop && npx tsc --noEmit

  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        include:
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      # Rust 检查放在 macOS job：src-tauri 依赖 tauri/objc2 等，
      # 在 Linux runner 上要额外装 GTK/WebKit 系统库才能编译。
      - name: Check Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib

      - name: Build application
        shell: bash
        run: |
          npm run build -w @ai-sub/core
          npm run tauri:build -w @ai-sub/desktop -- --target ${{ matrix.target }} --bundles app,dmg
        env:
          CI: true

      - name: Upload artifacts (macOS app)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: apps/desktop/src-tauri/target/*/release/bundle/**/*.app

      - name: Upload artifacts (macOS DMG)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: apps/desktop/src-tauri/target/*/release/bundle/**/*.dmg

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level moderate
        continue-on-error: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo audit
        run: |
          cargo install cargo-audit
          cd apps/desktop/src-tauri && cargo audit
        continue-on-error: true
